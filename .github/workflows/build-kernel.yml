name: build-kernel
"on":
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish the build as a GitHub release'
        type: boolean
        default: true
      release_tag:
        description: 'Release tag (auto-generated as kernel-YYYYMMDD when empty)'
        required: false
        default: ""
      kernel_repo:
        description: 'Kernel source repository (full URL or scp-style remote)'
        required: false
        default: ""
      kernel_branch:
        description: 'Kernel source branch'
        required: false
        default: "android12-5.10-cloudfox"
      kernel_commit:
        description: 'Kernel source commit'
        required: false
        default: ""
      clang_version:
        description: Clang toolchain version
        required: false
        type: choice
        options:
          - clang 19
          - clang 14
        default: "clang 19"
      pack_flashable:
        description: 'Build a universal self-patching flashable zip (on-device kernel replacement via ksud)'
        type: boolean
        default: true
      defconfig_fragment_exclude:
        description: 'Defconfig fragments to exclude (space- or comma-separated names). Default excludes kernelsu+metamodule: the built kernel carries NO root. Clear this field to build the stock CloudFox kernel with KernelSU.'
        required: false
        default: "kernelsu metamodule"
      append_build_env:
        description: 'Extra KEY=VALUE pairs appended to build.config.cloudfox (comma-separated, e.g. "TRIM_UNUSED_KSYMS=1,LOCALVERSION=-vanilla"; sourced by build.sh)'
        required: false
        default: ""
      append_config:
        description: 'Extra literal CONFIG_* lines injected into the defconfig (comma-separated, e.g. "CONFIG_KERNELSU=y,# CONFIG_X is not set")'
        required: false
        default: ""
      ccache:
        description: 'Accelerate with ccache. Cache is keyed by clang+repo+branch+fragment-exclusion, so runs with the same config reuse objects; changing the excluded fragments changes autoconf.h and forces a mostly cold rebuild once.'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kernel-build-${{ github.event.inputs.release_tag || 'default' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      KERNEL_REPO: ${{ inputs.kernel_repo }}
      KERNEL_BRANCH: ${{ inputs.kernel_branch }}
      KERNEL_COMMIT: ${{ inputs.kernel_commit }}
      CLANG_ASSET: ${{ fromJSON('{"clang 14":"clang-r450784e-linux-x86.tar.zst","clang 19":"clang-r536225-linux-x86.tar.zst"}')[inputs.clang_version] }}
      DEFCONFIG_FRAGMENT_EXCLUDE: ${{ inputs.defconfig_fragment_exclude }}
      APPEND_BUILD_ENV: ${{ inputs.append_build_env }}
      APPEND_CONFIG: ${{ inputs.append_config }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      CCACHE_OPT: ${{ inputs.ccache && '1' || '' }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo bash build/free-disk-space.sh
          df -h

      - name: Compute ccache key
        id: cachekey
        run: |
          set -euo pipefail
          # The excluded-fragment set changes the effective defconfig, hence
          # autoconf.h, hence nearly every object hash. Mixing those builds in
          # one cache bucket means each run evicts the other's objects and both
          # stay permanently cold, so the exclusion set is part of the key.
          # Normalized (comma->space, sorted, deduped) so "kernelsu metamodule",
          # "metamodule,kernelsu" and "kernelsu  metamodule" share one bucket.
          norm=$(printf '%s' "${DEFCONFIG_FRAGMENT_EXCLUDE:-none}" \
                 | tr ',' ' ' | tr -s ' ' '\n' | sed '/^$/d' | sort -u | paste -sd- -)
          [ -n "$norm" ] || norm=none
          echo "frag=$norm" >> "$GITHUB_OUTPUT"
          # Kernel branch is part of the key too; an empty input resolves to the
          # repo default branch, which would otherwise share a bucket with an
          # explicitly named different branch.
          echo "branch=${KERNEL_BRANCH:-default}" >> "$GITHUB_OUTPUT"
          echo "repo=$(printf '%s' "${KERNEL_REPO:-upstream}" | tr -c 'A-Za-z0-9._-' '-')" >> "$GITHUB_OUTPUT"
          echo "ccache bucket: cfx-ccache-$CLANG_ASSET-...-$norm"

      - name: Restore ccache cache
        if: ${{ inputs.ccache }}
        uses: actions/cache/restore@v4
        with:
          path: work/.ccache
          # Exact bucket first. restore-keys then walk outward: same config on
          # an older run, then any run of this branch, then any run on this
          # clang. ccache hashes object content, so even a loose match still
          # yields partial hits on the large amount of source shared between
          # configs; a cold start only costs the first build.
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ steps.cachekey.outputs.repo }}-${{ steps.cachekey.outputs.branch }}-${{ steps.cachekey.outputs.frag }}-${{ github.run_id }}
          restore-keys: |
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ steps.cachekey.outputs.repo }}-${{ steps.cachekey.outputs.branch }}-${{ steps.cachekey.outputs.frag }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ steps.cachekey.outputs.repo }}-${{ steps.cachekey.outputs.branch }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-${{ steps.cachekey.outputs.repo }}-
            cfx-ccache-${{ env.CLANG_ASSET }}-

      - name: Add 24G swap
        run: |
          sudo swapoff -a
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      - name: Build kernel
        env:
          KSU_PREBUILT_BASE: ${{ github.server_url }}/${{ github.repository }}/releases/download/prebuilts
        run: |
          # ksud is only the on-device boot-image repacker used by the flashable
          # zip (it swaps the kernel blob and nothing else). It does NOT inject
          # root: whether the kernel has KernelSU is decided at compile time by
          # the kernelsu defconfig fragment, which this workflow excludes by
          # default. The fetch is network-bound and independent of the compile,
          # so overlap it instead of serializing behind the ~180 minute build.
          ksu_pid=""
          if [ "${{ inputs.pack_flashable }}" == "true" ]; then
            ./build/kernelsu-fetch.sh &
            ksu_pid=$!
          fi
          ./build-kernel.sh ${{ inputs.ccache && '--ccache' || '' }}
          if [ -n "$ksu_pid" ]; then
            # A ksud mirror hiccup must not discard the finished ~180 minute
            # kernel build; record the failure and let the pack step skip the
            # flashable zip while the kernel release still publishes.
            wait "$ksu_pid" || echo "::warning::ksud fetch failed; flashable zip will be skipped"
          fi

      - name: ccache stats
        if: ${{ inputs.ccache && always() }}
        run: ccache -s 2>/dev/null || echo "ccache not available"

      - name: Save ccache cache
        if: ${{ inputs.ccache && always() }}
        uses: actions/cache/save@v4
        with:
          path: work/.ccache
          # run_id suffix makes every save a fresh, non-colliding entry, so the
          # cache actually grows warmer across runs. GitHub's cache/save refuses
          # to overwrite an existing key, which is why a fixed key would freeze
          # the bucket at whatever the very first (cold) run produced.
          key: cfx-ccache-${{ env.CLANG_ASSET }}-${{ steps.cachekey.outputs.repo }}-${{ steps.cachekey.outputs.branch }}-${{ steps.cachekey.outputs.frag }}-${{ github.run_id }}

      - name: Verify no root in built kernel
        run: |
          set -euo pipefail
          cfg=$(find work/dist -maxdepth 1 -name '.config' -print -quit)
          [ -n "$cfg" ] || cfg=$(find work/dist -maxdepth 1 -name 'ikconfig' -print -quit)
          if [ -z "$cfg" ]; then
            echo "::warning::no .config/ikconfig in work/dist; cannot verify"
            exit 0
          fi
          if grep -q '^CONFIG_KSU=y' "$cfg"; then
            echo "::warning::CONFIG_KSU=y -- this kernel HAS KernelSU built in"
          else
            echo "OK: CONFIG_KSU is not enabled; kernel carries no root"
          fi
          grep -E '^CONFIG_(LTO_CLANG_FULL|ZRAM|ZRAM_MULTI_COMP|CRYPTO_LZ4KD)=' "$cfg" || true

      - name: Pack flashable kernel zip
        if: ${{ inputs.pack_flashable }}
        run: |
          set -euo pipefail
          if [ ! -f "$PWD/kernelsu/ksud-aarch64-linux-android" ] || \
             [ ! -f "$PWD/kernelsu/ksud-armv7-linux-androideabi" ]; then
            echo "ksud binaries missing (fetch failed); skipping flashable zip"
            exit 0
          fi
          kernel_img=$(find work/dist -name 'Image' -print -quit)
          if [ -z "$kernel_img" ]; then
            kernel_img=$(find work/dist -name 'Image.lz4' -print -quit)
          fi
          if [ -z "$kernel_img" ]; then
            echo "no kernel Image found in work/dist" >&2
            find work/dist -type f | head -40
            exit 1
          fi
          mkdir -p work/pkg
          KERNEL_IMAGE="$kernel_img" \
          KSUD_ARM64="$PWD/kernelsu/ksud-aarch64-linux-android" \
          KSUD_ARMV7="$PWD/kernelsu/ksud-armv7-linux-androideabi" \
          ZIP_OUT="$PWD/work/pkg/cloudfox-kernel-flash.zip" \
            ./build/pack-flashable.sh

      - name: Upload flashable zip
        if: ${{ inputs.pack_flashable && !inputs.publish_release }}
        uses: actions/upload-artifact@v5
        with:
          name: kernel-flash-zip
          path: work/pkg/cloudfox-kernel-flash.zip
          # warn (not error): the pack step skips cleanly when the ksud fetch
          # failed, and a genuinely failed pack aborts the job before this step.
          if-no-files-found: warn

      - name: Publish release
        if: ${{ inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$RELEASE_TAG"
          if [ -z "$tag" ]; then
            tag="kernel-$(date -u +%Y%m%d)"
          fi
          cd "$GITHUB_WORKSPACE/work/dist"
          pkg="$GITHUB_WORKSPACE/work/pkg"
          mkdir -p "$pkg"
          assets=()
          for f in Image Image.lz4 vmlinux System.map ikconfig .config; do
            [ -f "$f" ] && assets+=("$f")
          done
          tar -I 'zstd -T0' -cf "$pkg/kernel-dist.tar.zst" .
          assets+=("$pkg/kernel-dist.tar.zst")
          if [ -f "$pkg/cloudfox-kernel-flash.zip" ]; then
            assets+=("$pkg/cloudfox-kernel-flash.zip")
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber "${assets[@]}"
          else
            gh release create "$tag" \
              --title "CloudFox kernel build $tag" \
              --notes "Built from ${{ inputs.kernel_repo || 'https://github.com/CloudFox-INC/CloudFox-Kernel' }} via Google's unmodified build.sh. Excluded fragments: ${{ inputs.defconfig_fragment_exclude || 'none' }}. $(date -u '+%Y-%m-%d %H:%M UTC')" \
              "${assets[@]}"
          fi
          echo "release $tag updated"
